name: Release

# Push a tag like v0.2.0 (or v0.3.0-beta.1 for a pre-release) to build the installer and
# create a *draft* GitHub release. Publishing the draft is a manual step: docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and draft the release
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag matches the version
        run: node scripts/version.ts check --tag "$env:TAG"

      - name: Build the installer
        run: pnpm tauri build
        env:
          # Built-in OAuth apps, read at compile time (option_env!). Unset secrets leave
          # them empty and the app asks for a client ID on first run, as a dev build does.
          PEETMAIL_MS_CLIENT_ID: ${{ secrets.PEETMAIL_MS_CLIENT_ID }}
          PEETMAIL_GOOGLE_CLIENT_ID: ${{ secrets.PEETMAIL_GOOGLE_CLIENT_ID }}
          PEETMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PEETMAIL_GOOGLE_CLIENT_SECRET }}

      - name: Collect release assets
        id: assets
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $out = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force $out | Out-Null

          $installer = "src-tauri/target/release/bundle/nsis/PeetMail_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer not found: $installer" }
          Copy-Item -LiteralPath $installer -Destination $out

          # Debug symbols for crash reports. Not installed; kept with the release so any
          # version's stack traces can be symbolicated later.
          $pdb = 'src-tauri/target/release/peetmail.pdb'
          if (-not (Test-Path -LiteralPath $pdb -PathType Leaf)) { throw "PDB not found: $pdb" }
          Compress-Archive -LiteralPath $pdb -DestinationPath (Join-Path $out "PeetMail_${version}_x64-symbols.zip")

          Push-Location $out
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.Name).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location

          Get-ChildItem $out | Format-Table Name, Length
          "dir=$out" >> $env:GITHUB_OUTPUT

      - name: Create or update the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          $files = Get-ChildItem -File $env:ASSETS | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A re-run: refresh the assets of the draft made last time.
            $draft = gh release view $env:TAG --json isDraft --jq .isDraft
            if ($draft -ne 'true') { throw "Release $env:TAG is already published; bump the version instead of rebuilding it." }
            gh release upload $env:TAG @files --clobber
          } else {
            $pre = if ($env:TAG.Contains('-')) { @('--prerelease') } else { @() }
            gh release create $env:TAG @files --draft --verify-tag --generate-notes --title "PeetMail $($env:TAG.TrimStart('v'))" @pre
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }

      - name: Verify the draft has every asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          $expected = Get-ChildItem -File $env:ASSETS | ForEach-Object Name
          $actual = @(gh release view $env:TAG --json assets --jq '.assets[].name')
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($missing.Count) { throw "Draft release is missing: $($missing -join ', ')" }
          "Draft ready: $(gh release view $env:TAG --json url --jq .url)" >> $env:GITHUB_STEP_SUMMARY
