name: Release

# Two update channels (see src-tauri/src/update.rs and docs/RELEASING.md):
#
#   canary  every push to master. Version <next patch>-canary.<run>, published at once as a
#           pre-release `canary-v<version>`; the fixed `canary` pre-release's latest.json is
#           then repointed at it. Older canary builds are pruned.
#   stable  a tag like v0.2.0. Drafted with latest.json; publishing the draft (by hand) is
#           what makes the stable channel offer it, through releases/latest.
#
# Each release has a Windows installer (NSIS) and a Linux AppImage, built side by side and
# published together with one latest.json listing both. Both run after the full CI, so
# nothing ships that hasn't passed it.

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # One run per ref at a time; a newer master push waits, and GitHub drops older waiting ones.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CANARY_KEEP: 10
  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'canary' }}
  # Crash reports (src-tauri/src/crash.rs). The DSN is compiled in; it isn't secret.
  # Uploads of symbols and source maps need the SENTRY_AUTH_TOKEN secret and are skipped,
  # with a warning, until it's set.
  SENTRY_ORG: ${{ vars.SENTRY_ORG || 'metroid' }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'peetmail' }}
  SENTRY_CLI: '@sentry/cli@3.6.0'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Work out the version
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: v
        shell: pwsh
        run: |
          if ($env:CHANNEL -eq 'stable') {
            node scripts/version.ts check --tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            # A release without its CHANGELOG.md section stops here (publish uses it as notes).
            node scripts/version.ts notes $version | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = node scripts/version.ts canary $env:GITHUB_RUN_NUMBER
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $tag = "canary-v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "Building $env:CHANNEL $version" >> $env:GITHUB_STEP_SUMMARY

  build:
    name: Build (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows
            runner: windows-latest
          # The oldest supported Ubuntu LTS: the AppImage links against its glibc, so it
          # runs on that and anything newer (Debian 12, Fedora, Arch, Mint, openSUSE...).
          - os: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE: peetmail@${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the canary version
        if: env.CHANNEL == 'canary'
        # Only for this build; nothing is committed.
        run: node scripts/version.ts set ${{ env.VERSION }}

      - name: Build the frontend with source maps
        run: pnpm build
        env:
          PEETMAIL_SOURCEMAPS: '1'

      - name: Upload source maps to Sentry, then drop them
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          OS: ${{ matrix.os }}
        run: |
          # Each build makes its own bundle (chunk names differ between them), so each uploads
          # its maps under its webview's origin: http://tauri.localhost on Windows,
          # tauri://localhost on Linux. `releases new` is fine to run twice.
          if ($env:SENTRY_AUTH_TOKEN) {
            $prefix = if ($env:OS -eq 'windows') { 'http://tauri.localhost/_app' } else { 'tauri://localhost/_app' }
            pnpm dlx $env:SENTRY_CLI releases new $env:RELEASE
            if ($LASTEXITCODE -ne 0) { throw "creating the Sentry release failed" }
            pnpm dlx $env:SENTRY_CLI sourcemaps upload build/_app --url-prefix $prefix --release $env:RELEASE --validate --wait
            if ($LASTEXITCODE -ne 0) { throw "source map upload failed" }
          } else {
            "::warning::SENTRY_AUTH_TOKEN isn't set: webview stack traces in Sentry won't be readable for this build."
          }
          # Not shipped: the binary embeds everything in build/.
          Get-ChildItem build -Recurse -Filter *.map | Remove-Item

      - name: Build the installer
        # tauri.release.conf.json turns on the signed updater artifacts (needs the key below)
        # and skips the frontend build: the step above did it. On Linux, tauri.linux.conf.json
        # (merged automatically) makes it an AppImage, and the binary's line tables are split
        # into peetmail.debug before bundling.
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = linux ]; then
            export CARGO_PROFILE_RELEASE_STRIP=false
            pnpm tauri build --config src-tauri/tauri.release.conf.json \
              --config '{"build":{"beforeBundleCommand":"sh scripts/split-debuginfo.sh"}}'
          else
            pnpm tauri build --config src-tauri/tauri.release.conf.json
          fi
        env:
          # Signs the installer for the updater (minisign; unrelated to Authenticode).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Compiled in (option_env!): which channel this build is on and where to look for updates.
          PEETMAIL_CHANNEL: ${{ env.CHANNEL }}
          PEETMAIL_UPDATE_REPO: ${{ github.repository }}
          PEETMAIL_SENTRY_DSN: ${{ vars.PEETMAIL_SENTRY_DSN }}
          PEETMAIL_FEEDBACK_EMAIL: ${{ vars.PEETMAIL_FEEDBACK_EMAIL }}
          # Usage telemetry (src-tauri/src/telemetry.rs): the OTLP gateway, and its auth
          # header(s) as key=value,key=value. The token ends up in the binary, so it must be
          # write-only and PeetMail's own. Unset: no telemetry.
          PEETMAIL_OTLP_ENDPOINT: ${{ vars.PEETMAIL_OTLP_ENDPOINT }}
          PEETMAIL_OTLP_HEADERS: ${{ secrets.PEETMAIL_OTLP_HEADERS }}
          # Built-in OAuth apps. Unset secrets leave them empty and the app asks for a
          # client ID on first run, as a dev build does.
          PEETMAIL_MS_CLIENT_ID: ${{ secrets.PEETMAIL_MS_CLIENT_ID }}
          PEETMAIL_GOOGLE_CLIENT_ID: ${{ secrets.PEETMAIL_GOOGLE_CLIENT_ID }}
          PEETMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PEETMAIL_GOOGLE_CLIENT_SECRET }}

      - name: Smoke-test the AppImage
        if: matrix.os == 'linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
          # Offline: this build has the production Sentry DSN and telemetry endpoint in it.
          SMOKE_OFFLINE=1 sh tests/linux/smoke.sh "src-tauri/target/release/bundle/appimage/PeetMail_${VERSION}_amd64.AppImage"

      - name: Upload debug symbols to Sentry
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN) {
            "::warning::SENTRY_AUTH_TOKEN isn't set: native stack traces in Sentry won't be symbolicated for this build."
            exit 0
          }
          $files = if ($IsWindows) {
            'src-tauri/target/release/peetmail.pdb', 'src-tauri/target/release/peetmail.exe'
          } else {
            'src-tauri/target/release/peetmail.debug', 'src-tauri/target/release/peetmail'
          }
          pnpm dlx $env:SENTRY_CLI debug-files upload --wait @files
          if ($LASTEXITCODE -ne 0) { throw "debug file upload failed" }

      - name: Collect the build's assets
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'assets'
          New-Item -ItemType Directory -Force $out | Out-Null
          if ($IsWindows) {
            $artifact = "src-tauri/target/release/bundle/nsis/PeetMail_$($env:VERSION)_x64-setup.exe"
            $symbols = 'src-tauri/target/release/peetmail.pdb'
            $symbolsZip = "PeetMail_$($env:VERSION)_x64-symbols.zip"
          } else {
            $artifact = "src-tauri/target/release/bundle/appimage/PeetMail_$($env:VERSION)_amd64.AppImage"
            $symbols = 'src-tauri/target/release/peetmail.debug'
            $symbolsZip = "PeetMail_$($env:VERSION)_amd64-linux-symbols.zip"
          }
          foreach ($f in @($artifact, "$artifact.sig", $symbols)) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "Build output missing: $f" }
          }
          Copy-Item -LiteralPath $artifact, "$artifact.sig" -Destination $out
          # Debug symbols for crash reports; not installed.
          Compress-Archive -LiteralPath $symbols -DestinationPath (Join-Path $out $symbolsZip)
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.os }}
          path: ${{ runner.temp }}/assets/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish (${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'canary' }})
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Write latest.json and checksums
        id: assets
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'release-assets'
          $base = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:TAG)"
          $exe = "PeetMail_$($env:VERSION)_x64-setup.exe"
          $appImage = "PeetMail_$($env:VERSION)_amd64.AppImage"
          foreach ($f in @($exe, "$exe.sig", $appImage, "$appImage.sig")) {
            if (-not (Test-Path -LiteralPath (Join-Path $out $f) -PathType Leaf)) { throw "Build output missing: $f" }
          }
          if ($env:CHANNEL -eq 'stable') {
            # The release notes are the version's CHANGELOG.md section.
            node scripts/version.ts notes $env:VERSION | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'notes.md')
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $notes = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/$($env:TAG)"
          } else {
            $notes = git log -1 --format=%s $env:GITHUB_SHA
          }
          node scripts/update-manifest.ts --version $env:VERSION `
            --windows-url "$base/$exe" --windows-sig (Join-Path $out "$exe.sig") `
            --linux-url "$base/$appImage" --linux-sig (Join-Path $out "$appImage.sig") `
            --notes "$notes" --out (Join-Path $out 'latest.json')
          if ($LASTEXITCODE -ne 0) { throw "manifest failed" }

          Push-Location $out
          $sums = Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.Name).Hash.ToLower())  $($_.Name)"
          }
          if (-not $sums) { throw "nothing to checksum" }
          $sums | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location

          Get-ChildItem $out | Format-Table Name, Length
          "dir=$out" >> $env:GITHUB_OUTPUT

      - name: Finalize the Sentry release
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if (-not $env:SENTRY_AUTH_TOKEN) { exit 0 }
          npx --yes $env:SENTRY_CLI releases finalize "peetmail@$($env:VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "finalizing the Sentry release failed" }

      - name: Draft the stable release
        if: env.CHANNEL == 'stable'
        shell: pwsh
        env:
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          $files = Get-ChildItem -File $env:ASSETS | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # A re-run: refresh the assets of the draft made last time.
            $draft = gh release view $env:TAG --json isDraft --jq .isDraft
            if ($draft -ne 'true') { throw "Release $env:TAG is already published; bump the version instead of rebuilding it." }
            gh release upload $env:TAG @files --clobber
          } else {
            # A pre-release tag (v0.3.0-beta.1) never becomes "latest", so the stable channel ignores it.
            $pre = if ($env:VERSION.Contains('-')) { @('--prerelease') } else { @() }
            # The changelog section first, then GitHub's list of commits and PRs.
            gh release create $env:TAG @files --draft --verify-tag --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md') --generate-notes --title "PeetMail $env:VERSION" @pre
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }

      - name: Publish the canary build
        if: env.CHANNEL == 'canary'
        shell: pwsh
        env:
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          $files = Get-ChildItem -File $env:ASSETS | ForEach-Object FullName
          $subject = git log -1 --format=%s $env:GITHUB_SHA
          $notes = "Canary build of $($env:GITHUB_SHA.Substring(0,7)): $subject`n`nBuilt automatically from master. Install it, or switch to the Canary channel in Settings, to get every change as it lands."
          gh release create $env:TAG @files --prerelease --latest=false --target $env:GITHUB_SHA --title "Canary $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "creating $env:TAG failed" }

      - name: Point the canary channel at this build
        if: env.CHANNEL == 'canary'
        shell: pwsh
        env:
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          # Only now that the build's release is complete does the channel's manifest move.
          gh release view canary *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create canary --prerelease --latest=false --target $env:GITHUB_SHA --title "Canary channel" `
              --notes "The Canary update channel reads latest.json from here. It always points at the newest canary-v* build."
            if ($LASTEXITCODE -ne 0) { throw "creating the canary release failed" }
          }
          gh release upload canary (Join-Path $env:ASSETS 'latest.json') --clobber
          if ($LASTEXITCODE -ne 0) { throw "updating canary/latest.json failed" }
          "Canary channel now serves $env:TAG" >> $env:GITHUB_STEP_SUMMARY

      - name: Prune old canary builds
        if: env.CHANNEL == 'canary'
        shell: pwsh
        run: |
          $old = gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("canary-v"))] | sort_by(.createdAt) | reverse | .[].tagName' |
            Select-Object -Skip ([int]$env:CANARY_KEEP)
          foreach ($tag in $old) {
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { Write-Warning "couldn't delete $tag" }
          }

      - name: Verify the release has every asset
        shell: pwsh
        env:
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          $expected = Get-ChildItem -File $env:ASSETS | ForEach-Object Name
          $actual = @(gh release view $env:TAG --json assets --jq '.assets[].name')
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($missing.Count) { throw "Release $env:TAG is missing: $($missing -join ', ')" }
          if ($env:CHANNEL -eq 'canary') {
            $feed = @(gh release view canary --json assets --jq '.assets[].name')
            if ('latest.json' -notin $feed) { throw "canary/latest.json is missing" }
          }
          "Release: $(gh release view $env:TAG --json url --jq .url)" >> $env:GITHUB_STEP_SUMMARY
