# cargo-deny: licences, advisories, duplicate/banned crates and registry sources.
# CI runs `cargo deny check` (see .github/workflows/ci.yml).

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Unmaintained crates deep in Tauri's tree are reported, not fatal; vulnerabilities fail.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
